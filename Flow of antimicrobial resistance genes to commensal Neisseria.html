  }

}
function reset() { hl.replaceChildren(); ribbons.forEach(e => e.style.opacity = ''); nodeEls.forEach(e => e.style.opacity = ''); tip.style.opacity = 0; }
function tipAt(ev, a, b, n) { tip.innerHTML = `<b>${a}</b><br>${b}<br>${n} ${n===1?'entry':'entries'}`; tip.style.opacity = 1; tip.style.left = (ev.clientX+14)+'px'; tip.style.top = (ev.clientY+12)+'px'; }
for (const e of nodeEls) {
  const N = D.nodes[e.dataset.node];
  e.addEventListener('mouseenter', () => show(N.rows));
  e.addEventListener('mousemove', ev => tipAt(ev, N.name, N.sub, N.rows.length));
  e.addEventListener('mouseleave', reset);
}
for (const e of ribbons) {
  const L = D.links[e.id];
  e.addEventListener('mouseenter', () => show(L.rows));
  e.addEventListener('mousemove', ev => tipAt(ev, L.name, L.sub, L.rows.length));
  e.addEventListener('mouseleave', reset);
}
</script>
</body>
</html>
